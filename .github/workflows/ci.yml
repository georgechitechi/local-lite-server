name: CI

on:
  push:
    branches: [main, feat/sync-engine-v2]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: local_lite_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: root
          POSTGRES_DB: local_lite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install
      - run: npm --prefix dashboard install
      - run: npm run build
      - run: npm test
        env:
          TEST_MYSQL_URL: mysql://root:root@127.0.0.1:3306/local_lite_test
          TEST_POSTGRES_URL: postgres://postgres:root@127.0.0.1:5432/local_lite_test
      - run: npm run build:cpanel
